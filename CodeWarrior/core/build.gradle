[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  api "space.earlygrey:shapedrawer:$shapeDrawerVersion"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Testes automáticos da lógica do jogo: gradlew.bat core:testarLogica
tasks.register('testarLogica', JavaExec) {
  group = 'verification'
  description = 'Roda as verificações automáticas da lógica do jogo'
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'com.codewarrior.logica.TestesLogica'
  jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}
